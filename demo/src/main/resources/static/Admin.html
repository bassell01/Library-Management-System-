<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard</title>
<style>
  /* Reset and base */
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0; 
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #e9edf1;
    color: #2e3a59;
  }

  .dashboard-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1200px;
    margin: 0 auto;
    background-color: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    overflow: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    background: #2f4f80;
    color: white;
    font-weight: 700;
    font-size: 1.8rem;
    user-select: none;
  }

  .logout-btn {
    background-color: #f05454;
    border: none;
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 1rem;
    transition: background-color 0.3s ease;
  }
  .logout-btn:hover {
    background-color: #d94343;
  }

  nav {
    display: flex;
    background-color: #f1f4f8;
    border-bottom: 2px solid #2f4f80;
  }

  .tab {
    flex: 1;
    padding: 1rem 0;
    font-weight: 700;
    font-size: 1.1rem;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #2f4f80;
    transition: all 0.3s ease;
    border-bottom: 3px solid transparent;
  }

  .tab:hover {
    background-color: #dbe7f7;
  }

  .tab.active {
    background-color: #2f4f80;
    color: white;
    border-bottom: 3px solid #f05454;
  }

  main {
    flex-grow: 1;
    padding: 2rem 3rem;
    overflow-y: auto;
  }

  section h2 {
    margin-top: 0;
    font-weight: 700;
    font-size: 1.6rem;
    color: #2f4f80;
    margin-bottom: 1.5rem;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  form input {
    flex: 1 1 180px;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    border-radius: 10px;
    border: 1.8px solid #cbd5e1;
    transition: border-color 0.3s ease;
  }
  form input:focus {
    outline: none;
    border-color: #2f4f80;
    box-shadow: 0 0 6px rgba(47,79,128,0.4);
  }

  form button {
    flex-shrink: 0;
    background-color: #2f4f80;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0.75rem 1.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  form button:hover {
    background-color: #f05454;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 8px;
  }

  thead tr th {
    background-color: #2f4f80;
    color: white;
    padding: 12px 15px;
    text-align: left;
    font-weight: 700;
    border-radius: 8px 8px 0 0;
  }

  tbody tr {
    background-color: #f9fbfd;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    border-radius: 12px;
    transition: background-color 0.3s ease;
  }
  tbody tr:hover {
    background-color: #e3ebf8;
  }

  tbody tr td {
    padding: 12px 15px;
    vertical-align: middle;
  }

  tbody tr td input {
    border: 1.5px solid transparent;
    background-color: transparent;
    font-size: 1rem;
    padding: 4px 6px;
    border-radius: 6px;
    width: 100%;
    transition: border-color 0.25s ease;
  }
  tbody tr td input:focus {
    border-color: #2f4f80;
    background-color: #fff;
    outline: none;
    box-shadow: 0 0 5px rgba(47,79,128,0.4);
  }

  tbody tr td button {
    background-color: #2f4f80;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 0.5rem;
    transition: background-color 0.3s ease;
  }
  tbody tr td button:hover {
    background-color: #f05454;
  }

  tbody tr td button:last-child {
    margin-right: 0;
    background-color: #888;
  }
  tbody tr td button:last-child:hover {
    background-color: #555;
  }

  /* Scrollbar for main content */
  main::-webkit-scrollbar {
    width: 10px;
  }
  main::-webkit-scrollbar-track {
    background: #f1f4f8;
  }
  main::-webkit-scrollbar-thumb {
    background-color: #2f4f80;
    border-radius: 10px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .dashboard-container {
      max-width: 100%;
      border-radius: 0;
    }
    main {
      padding: 1rem 1.5rem;
    }
    form {
      flex-direction: column;
    }
    form input, form button {
      flex: none;
      width: 100%;
    }
    tbody tr td button {
      margin-bottom: 0.5rem;
      width: 48%;
    }
    tbody tr td button:last-child {
      margin-right: 0;
      margin-bottom: 0;
      width: 48%;
    }
  }
</style>
</head>
<body>
<div class="dashboard-container">
  <header>
    <div>Admin Dashboard</div>
    <button class="logout-btn">Logout</button>
  </header>
  <nav>
    <button class="tab active" onclick="switchTab('books')">Books</button>
    <button class="tab" onclick="switchTab('members')">Members</button>
  </nav>
  <main>
    <section id="books" class="tab-content active" aria-label="Manage Books Section">
      <h2>Manage Books</h2>
      <form id="book-form" aria-label="Add new book form" enctype="multipart/form-data">
        <input type="text" placeholder="Title" required aria-required="true" name="title" />
        <input type="text" placeholder="Author" required aria-required="true" name="author" />
        <input type="text" placeholder="Genre" required aria-required="true" name="genre" />
        <input type="number" placeholder="Price" min="0" step="0.01" required aria-required="true" name="price" />
        <input type="number" name="quantity" placeholder="Quantity" min="0" required>
        <input type="file" accept="image/*" required aria-required="true" name="image" />
        <button type="submit">Add Book</button>
      </form>
      
      <table aria-describedby="bookTableCaption">
        <caption id="bookTableCaption" class="sr-only">List of books with editable details and actions</caption>
        <thead>
          <tr><th>Title</th><th>Author</th><th>Genre</th><th>Price</th><th>Actions</th></tr>
        </thead>
        <tbody id="book-table-body"></tbody>
      </table>
    </section>
    <section id="members" class="tab-content" aria-label="Manage Members Section" hidden>
      <h2>Manage Members</h2>
      <table aria-describedby="memberTableCaption">
        <caption id="memberTableCaption" class="sr-only">List of members with editable details and actions</caption>
        <thead>
          <tr><th>Username</th><th>Address</th><th>Actions</th></tr>
        </thead>
        <tbody id="member-table-body"></tbody>
      </table>
    </section>
  </main>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => {
      el.classList.remove('active');
      el.setAttribute('hidden', '');
    });
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    const activeContent = document.getElementById(tab);
    activeContent.classList.add('active');
    activeContent.removeAttribute('hidden');
    document.querySelector(`button[onclick="switchTab('${tab}')"]`).classList.add('active');
  }
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const bookForm = document.getElementById("book-form");
    const bookTableBody = document.getElementById("book-table-body");

    fetchBooks();

    function fetchBooks() {
      fetch('/api/books')
        .then(res => res.json())
        .then(books => {
          bookTableBody.innerHTML = '';
          books.forEach(book => {
            const row = document.createElement('tr');
            row.innerHTML = `
            <td><img src="${book.imageUrl}" alt="${book.title}" width="60" style="border-radius: 8px; margin-bottom: 6px;"><br><input value="${book.title}" data-id="${book.bookId}" data-field="title"></td>
        
              <td><input value="${book.title}" data-id="${book.bookId}" data-field="title" aria-label="Book Title"></td>
              <td><input value="${book.author}" data-id="${book.bookId}" data-field="author" aria-label="Book Author"></td>
              <td><input value="${book.genre}" data-id="${book.bookId}" data-field="genre" aria-label="Book Genre"></td>
              <td><input type="number" value="${book.price}" data-id="${book.bookId}" data-field="price" aria-label="Book Price" step="0.01" min="0"></td>
              <td><input type="number" value="${book.quantity}" data-id="${book.bookId}" data-field="quantity" min="0"></td>
              <td>
                <button onclick="updateBook(${book.bookId})" aria-label="Save book ${book.title}">Save</button>
                <button onclick="deleteBook(${book.bookId})" aria-label="Delete book ${book.title}">Delete</button>
              </td>
            `;
            bookTableBody.appendChild(row);
          });
        });
    }

    bookForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const inputs = bookForm.querySelectorAll("input");
      const newBook = {
        title: inputs[0].value.trim(),
        author: inputs[1].value.trim(),
        genre: inputs[2].value.trim(),
        price: parseFloat(inputs[3].value)
      };
      fetch('/api/books', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newBook)
      })
      .then(res => res.json())
      .then(() => {
        bookForm.reset();
        fetchBooks();
      });
    });

    bookForm.addEventListener("submit", function (e) {
  e.preventDefault();
  const formData = new FormData(bookForm);

  fetch('/api/books', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(() => {
    bookForm.reset();
    fetchBooks();
  });
});


    window.deleteBook = function(id) {
      if(confirm('Are you sure you want to delete this book?')) {
        fetch(`/api/books/${id}`, { method: 'DELETE' })
          .then(() => fetchBooks());
      }
    };

    window.updateBook = function(id) {
      const inputs = document.querySelectorAll(`input[data-id='${id}']`);
      const updatedBook = {};
      inputs.forEach(input => {
        updatedBook[input.dataset.field] = input.type === 'number' ? parseFloat(input.value) : input.value.trim();
      });
      fetch(`/api/books/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedBook)
      }).then(() => fetchBooks());
    };
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const memberTableBody = document.getElementById("member-table-body");

    fetchMembers();

    function fetchMembers() {
      fetch('/api/members')
        .then(res => res.json())
        .then(members => {
          memberTableBody.innerHTML = '';
          members.forEach(member => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td><input value="${member.username}" data-id="${member.userId}" data-field="username" aria-label="Member Username"></td>
              <td><input value="${member.address}" data-id="${member.userId}" data-field="address" aria-label="Member Address"></td>
              <td>
                <button onclick="updateMember(${member.userId})" aria-label="Save member ${member.username}">Save</button>
                <button onclick="deleteMember(${member.userId})" aria-label="Delete member ${member.username}">Delete</button>
              </td>
            `;
            memberTableBody.appendChild(row);
          });
        });
    }

    window.deleteMember = function(id) {
      if(confirm('Are you sure you want to delete this member?')) {
        fetch(`/api/members/${id}`, { method: 'DELETE' })
          .then(() => fetchMembers());
      }
    };

    window.updateMember = function(id) {
      const inputs = document.querySelectorAll(`input[data-id='${id}']`);
      const updatedMember = {};
      inputs.forEach(input => {
        updatedMember[input.dataset.field] = input.value.trim();
      });

      fetch(`/api/members/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedMember)
      }).then(() => fetchMembers());
    };
  });
</script>
</body>
</html>
