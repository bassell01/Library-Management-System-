<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Book Transaction History</title>
    <link rel="stylesheet" type="text/css" href="/css/history.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

  <!-- Navbar -->
  <header class="header">
    <div class="container navbar-container">
      <div></div> <!-- empty left space -->
      <a href="home.html" class="logo-link">
        <img src="/uploads/Screenshot 2025-05-27 232623.png" alt="Riwaya Logo" class="logo-img" />
      </a>
      <div></div> <!-- empty right space -->
    </div>
  </header>

  <div class="container">
    <h1>Book Transaction History</h1>
    <table class="history-table">
      <thead>
        <tr>
          <th>Book Title</th>
          <th>Author</th>
          <th>Type</th>
          <th>Date Issued</th>
          <th>Due Date</th>
          <th>Payment Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="transaction : ${history}">
          <td th:text="${transaction.book.title}">Title</td>
          <td th:text="${transaction.book.author}">Author</td>
          <td th:text="${transaction.type}">Type</td>
          <td th:text="${transaction.dateIssued != null ? #temporals.format(transaction.dateIssued, 'dd/MM/yyyy') : 'N/A'}">Issued</td>
          <td th:text="${transaction.dueDate != null ? #temporals.format(transaction.dueDate, 'dd/MM/yyyy') : 'N/A'}">Due</td>
          <td th:text="${transaction.paymentStatus}">Status</td>
        </tr>
      </tbody>
    </table>
    <a th:href="@{/dashboard}" class="back-btn">Back to Dashboard</a>
  </div>

</body>
</html>
