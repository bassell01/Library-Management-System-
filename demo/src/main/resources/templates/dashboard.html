<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>User Dashboard</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

<!-- Navbar -->
<header class="header">
  <div class="container navbar-container">
    <a href="home.html" class="logo-link">
      <img src="/uploads/Screenshot 2025-05-27 232623.png" alt="Riwaya Logo" class="logo-img" />
    </a>
    <div class="username-display">
      Welcome, <span th:text="${user.username}">User</span>!
    </div>
  </div>
</header>

<!-- Main Container -->
<div class="container dashboard-container">
  <div class="user-info">
    <p><span class="label">User ID:</span> <span th:text="${user.userId}"></span></p>
    <p><span class="label">Username:</span> <span th:text="${user.username}"></span></p>
    <p><span class="label">Address:</span> <span th:text="${user.address}"></span></p>
  </div>

  <div class="button-group">
    <a th:href="@{/member/home}" class="btn">Home</a>
    <a th:href="@{/dashboard/history}" class="btn">View History</a>
  </div>
</div>

<!-- Footer (Same as home.html) -->
<footer class="footer">
  <div class="container footer-content">
    <div class="footer-logo">
      <img src="/uploads/Screenshot 2025-05-27 232623.png" alt="Riwaya Logo" class="logo-img" />
    </div>
    <!-- <div class="footer-section about">
      <h3>Riwaya Library</h3>
      <p>Your gateway to knowledge and stories. Join us and dive into the world of books.</p>
    </div> -->
    <div class="footer-section links">
      <h4>Quick Links</h4>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="/books">Books</a></li>
        <li><a href="About.html">About Us</a></li>
        <li><a href="Contact.html">Contact</a></li>
      </ul>
    </div>
    <div class="footer-section contact">
      <h4>Contact Us</h4>
      <p>Email: support@riwaya.com</p>
      <p>Phone: +19666</p>
      <p>Address: 123 Library St., Nasr City</p>
    </div>
    <div class="footer-section social">
      <h4>Follow Us</h4>
      <div class="social-icons">
        <a href="#" aria-label="Facebook" class="social-icon facebook"></a>
        <a href="#" aria-label="Twitter" class="social-icon twitter"></a>
        <a href="#" aria-label="Instagram" class="social-icon instagram"></a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <p>© 2025 Riwaya Library. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
