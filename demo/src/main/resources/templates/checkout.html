<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Checkout</title>
    <link rel="stylesheet" type="text/css" href="/css/checkout.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

  <div class="checkout-container">

    <h1>Checkout</h1>

    <div class="book-details">
        <h2><strong>Book Name:</strong> <span th:text="${book.title}">Book Title</span></h2>
        <p><strong>Author Name:</strong> <span th:text="${book.author}">Author Name</span></p>
        <p><strong>Price:</strong> $<span th:text="${book.price}">0.00</span></p>
    </div>

    <div th:if="${type.equals('purchase')}">
        <form th:action="@{/checkout/complete}" method="post" novalidate>
            <input type="hidden" name="bookId" th:value="${book.bookId}" />
            <input type="hidden" name="type" th:value="${type}" />

            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" pattern="[0-9]{13,19}" maxlength="19" placeholder="1234 5678 9012 3456" required />
            <small>Enter 13 to 19 digits</small>

            <label for="cardHolderName">Cardholder Name</label>
            <input type="text" id="cardHolderName" name="cardHolderName" placeholder="John Doe" required />

            <label for="expiryDate">Expiry Date (MM/YY)</label>
            <input type="text" id="expiryDate" name="expiryDate" pattern="^(0[1-9]|1[0-2])\/?([0-9]{2})$" placeholder="MM/YY" required />

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" pattern="[0-9]{3,4}" maxlength="4" placeholder="123" required />

            <button type="submit" class="btn-purchase">Confirm Purchase</button>
        </form>
    </div>

    <div th:if="${!type.equals('purchase')}">
        <form th:action="@{/checkout/complete}" method="post">
            <input type="hidden" name="bookId" th:value="${book.bookId}" />
            <input type="hidden" name="type" th:value="${type}" />
            <button type="submit" class="btn-borrow">Confirm Borrow</button>
        </form>
    </div>

  </div>

</body>
</html>
