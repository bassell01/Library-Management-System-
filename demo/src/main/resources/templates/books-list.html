<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books Listing</title>
    <link rel="stylesheet" type="text/css" href="/css/book-list.css">
</head>
<body>
    <header class="page-header">
        <h1>Available Books</h1>
    </header>
    
    <div class="card-container">
        <div class="book-card" th:each="book : ${books}">
            <img th:src="${book.imageUrl}" alt="Book Cover">
            <div class="card-text">
                <h3 th:text="${book.title}">Book Title</h3>
                <p><strong>Author:</strong> <span th:text="${book.author}"></span></p>
                <p><strong>Genre:</strong> <span th:text="${book.genre}"></span></p>
                <p><strong>Price:</strong> $<span th:text="${book.price}"></span></p>
                <a th:href="@{/books/{id}(id=${book.bookId})}">View</a>
            </div>
        </div>
    </div>

    <div class="back-button-container">
        <a class="view-button" th:href="@{/dashboard}">Back to Dashboard</a>
    </div>
    
</body>
</html>
